# TEMPORARY: per-stage CI diagnostics for root-cause discovery — REMOVE after full green
name: CI diagnostics

on:
  push:
    branches: [main]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: "stage: skills:check"
        continue-on-error: true
        run: |
          ec=0
          npm run skills:check 2>&1 | tee /tmp/stage-skills-check.log || ec=$?
          if [ $ec -ne 0 ]; then
            echo "skills:check" >> /tmp/failed-stages.txt
            echo "::error title=stage skills:check failed::$(tr '\n' ' ' < /tmp/stage-skills-check.log | sed 's/%/%25/g' | tail -c 1200)"
          fi
          exit $ec
      - name: "stage: compat"
        continue-on-error: true
        run: |
          ec=0
          npm run compat 2>&1 | tee /tmp/stage-compat.log || ec=$?
          if [ $ec -ne 0 ]; then
            echo "compat" >> /tmp/failed-stages.txt
            echo "::error title=stage compat failed::$(tr '\n' ' ' < /tmp/stage-compat.log | sed 's/%/%25/g' | tail -c 1200)"
          fi
          exit $ec
      - name: "stage: golden:check"
        continue-on-error: true
        run: |
          ec=0
          npm run golden:check 2>&1 | tee /tmp/stage-golden-check.log || ec=$?
          if [ $ec -ne 0 ]; then
