<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../utilities.css">
  <link rel="stylesheet" href="../mock.css">
  <style>
    * { box-sizing: border-box; }
    main { display: flex; flex-direction: column; justify-content: center; }
    form { display: flex; flex-direction: column; max-width: 28rem; margin: 0 auto; }
    label { display: flex; flex-direction: column; font-size: var(--font-size-sm); }
    input { height: 48px; border-width: 1px; border-style: solid; }
    input:focus-visible { outline: 3px solid var(--color-text); outline-offset: 2px; }
    button:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body class="m-0 bg-bg text-text font-body text-body">
  <!-- state:default -->
  <!-- rule: nome vazio vira Visitante; role fixo Estoquista -->
  <main class="min-h-screen p-4">
    <form class="w-full gap-4">
      <!-- component:card size=md tone=elevated state=default --><div data-component="card" data-size="md" data-tone="elevated" data-state="default" class="rounded-md font-body p-2 text-body bg-accent text-bg">
  <!-- slot:title --><h1 class="m-0 text-heading font-bold">Criar conta</h1><!-- /slot:title -->
  <!-- slot:body --><p class="m-0 leading-body">Cadastre-se para controlar seu estoque.</p>
  <label class="gap-2 mt-3">Nome completo<input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="text" placeholder="Maria da Silva" autocomplete="name"></label>
  <label class="gap-2 mt-3">E-mail<input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="email" placeholder="voce@empresa.com.br" autocomplete="email"></label>
  <label class="gap-2 mt-3">Senha<input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password"></label>
  <label class="gap-2 mt-3">Confirmar senha<input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="password" placeholder="Repita a senha" autocomplete="new-password"></label><!-- /slot:body -->
</div><!-- /component:card -->
      <!-- component:button size=md tone=primary state=default --><button type="button" data-component="button" data-size="md" data-tone="primary" data-state="default" class="rounded-md font-body p-2 text-body bg-accent text-bg"><!-- slot:label -->Criar conta<!-- /slot:label --></button><!-- /component:button -->
      <!-- component:button size=md tone=ghost state=default --><button type="button" data-component="button" data-size="md" data-tone="ghost" data-state="default" class="rounded-md font-body p-2 text-body text-accent border-accent"><!-- slot:label -->Já tenho uma conta<!-- /slot:label --></button><!-- /component:button -->
    </form>
  </main>
  <script src="../mock.js"></script>
  <script>
    document.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault()
      const nome = document.querySelector('input[type=text]').value.trim()
      const email = document.querySelector('input[type=email]').value.trim()
      Mock.state.set('user', { name: nome || 'Visitante', email, role: 'Estoquista' })
      Mock.toast('Conta criada com sucesso')
      Mock.go('../dashboard/01-overview.html')
    })
    document.querySelector('[data-component="button"][data-tone="primary"]').addEventListener('click', () => {
      document.querySelector('form').requestSubmit()
    })
  </script>
</body>
</html>
