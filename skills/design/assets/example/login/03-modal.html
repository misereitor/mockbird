<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excluir conta</title>
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../utilities.css">
  <link rel="stylesheet" href="../mock.css">
</head>
<body class="m-0 bg-bg text-text font-body text-body">
  <style>
    .excluir-tela { display: flex; flex-direction: column; justify-content: center; }
    .excluir-tela * { box-sizing: border-box; }
    .excluir-dialogo { display: flex; flex-direction: column; gap: var(--space-3); width: 100%; max-width: 28rem; margin: 0 auto; }
    .excluir-acoes { display: flex; flex-direction: column; gap: var(--space-2); }
    .excluir-acao button { width: 100%; min-height: 44px; }
    .excluir-acao button:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  </style>
  <main class="excluir-tela min-h-screen p-4">
    <div class="excluir-dialogo">
      <!-- component:modal size=md tone=danger state=default --><div data-component="modal" data-size="md" data-tone="danger" data-state="default" class="rounded-md font-body p-2 text-body bg-text text-bg" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <h2 id="modal-titulo" class="m-0 modal-titulo text-heading font-bold"><!-- slot:header -->Excluir conta?<!-- /slot:header --></h2>
  <div class="modal-corpo mt-2"><!-- slot:body --><p class="m-0 leading-body">A conta de demonstração e os dados criados no fluxo serão apagados deste dispositivo. Essa ação não pode ser desfeita.</p><!-- /slot:body --></div>
  <div class="modal-rodape mt-2"><!-- slot:footer --><div class="excluir-acoes">
        <div class="excluir-acao" onclick="Mock.state.clear(); Mock.toast('Conta excluída'); Mock.go('../dashboard/01-overview.html')">
          <button type="button" data-component="button" data-size="md" data-tone="primary" data-state="default" data-autofocus class="rounded-md font-body p-2 text-body bg-accent text-bg">Excluir conta</button>
        </div>
        <div class="excluir-acao" onclick="document.querySelector('.mock-overlay') ? Mock.close() : Mock.go('01-login.html')">
          <button type="button" data-component="button" data-size="md" data-tone="ghost" data-state="default" class="rounded-md font-body p-2 text-body text-accent border-accent">Voltar</button>
        </div>
      </div><!-- /slot:footer --></div>
</div><!-- /component:modal -->
    </div>
  </main>
  <script src="../mock.js"></script>
</body>
</html>
