<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="../utilities.css">
  <link rel="stylesheet" href="../mock.css">
  <style>
    * { box-sizing: border-box; }
    main { display: flex; flex-direction: column; justify-content: center; }
    form { display: flex; flex-direction: column; max-width: 28rem; margin: 0 auto; }
    label { display: flex; flex-direction: column; font-size: var(--font-size-sm); }
    input { height: 48px; border-width: 1px; border-style: solid; }
    input:focus-visible { outline: 3px solid var(--color-text); outline-offset: 2px; }
    button:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  </style>
</head>
<body class="m-0 bg-bg text-text font-body text-body">
  <!-- state:default -->
  <!-- rule: e-mail sem cadastro entra como usuário demo -->
  <main class="min-h-screen p-4">
    <form class="w-full gap-4">
      <!-- component:card size=md tone=elevated state=default --><div data-component="card" data-size="md" data-tone="elevated" data-state="default" class="rounded-md font-body p-2 text-body bg-accent text-bg">
  <!-- slot:title --><h1 class="m-0 text-heading font-bold">Entrar</h1><!-- /slot:title -->
  <!-- slot:body --><p class="m-0 leading-body">Acesse sua conta para continuar.</p><!-- /slot:body -->
</div><!-- /component:card -->
      <!-- component:field size=md tone=default state=default --><div data-component="field" data-size="md" data-tone="default" data-state="default" class="rounded-md font-body p-2 text-body bg-surface text-text">
  <label class="gap-2"><!-- slot:label -->E-mail<!-- /slot:label -->
    <!-- slot:input --><input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="email" placeholder="voce@empresa.com.br" autocomplete="email"><!-- /slot:input -->
  </label>
  <div class="field-ajuda mt-2"><!-- slot:hint --><!-- /slot:hint --></div>
</div><!-- /component:field -->
      <!-- component:field size=md tone=default state=default --><div data-component="field" data-size="md" data-tone="default" data-state="default" class="rounded-md font-body p-2 text-body bg-surface text-text">
  <label class="gap-2"><!-- slot:label -->Senha<!-- /slot:label -->
    <!-- slot:input --><input class="w-full p-2 rounded-md border-border bg-surface text-text font-body text-body" type="password" placeholder="Sua senha" autocomplete="current-password"><!-- /slot:input -->
  </label>
  <div class="field-ajuda mt-2"><!-- slot:hint --><!-- /slot:hint --></div>
</div><!-- /component:field -->
      <!-- component:button size=md tone=primary state=default --><button type="button" data-component="button" data-size="md" data-tone="primary" data-state="default" class="rounded-md font-body p-2 text-body bg-accent text-bg"><!-- slot:label -->Entrar<!-- /slot:label --></button><!-- /component:button -->
      <!-- component:button size=md tone=ghost state=default --><button type="button" data-component="button" data-size="md" data-tone="ghost" data-state="default" class="rounded-md font-body p-2 text-body text-accent border-accent"><!-- slot:label -->Esqueci minha senha<!-- /slot:label --></button><!-- /component:button -->
      <p class="m-0 text-muted text-body">Não usa mais o Estoque? <a href="03-modal.html">Excluir conta</a></p>
    </form>
  </main>
  <script src="../mock.js"></script>
  <script>
    document.querySelector('form').addEventListener('submit', async (event) => {
      event.preventDefault()
      const email = document.querySelector('input[type=email]').value.trim()
      const users = (await Mock.data('users')) ?? []
      const user = users.find((u) => u.email.toLowerCase() === email.toLowerCase())
        ?? { name: email.split('@')[0] || 'Visitante', email, role: 'Estoquista' }
      Mock.state.set('user', user)
      Mock.toast(`Bem-vindo, ${user.name.split(' ')[0]}!`)
      Mock.go('../dashboard/01-overview.html')
    })
    document.querySelector('[data-component="button"][data-tone="primary"]').addEventListener('click', () => {
      document.querySelector('form').requestSubmit()
    })
  </script>
</body>
</html>
