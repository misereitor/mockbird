<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visão geral</title>
  <link rel="stylesheet" href="../design-system.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
    header h1 { margin: 0; font-size: var(--font-size-lg); }
    header p { margin: 0; color: var(--color-text-muted); font-size: var(--font-size-sm); }
    .menu-acoes { display: flex; flex-direction: column; min-width: 200px; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    [role="menuitem"] { display: flex; align-items: center; gap: var(--space-2); cursor: pointer; }
    .menu-atalho { margin-left: auto; opacity: 0.75; }
    main { flex: 1; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .card { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .card strong { display: block; }
    .card small { color: var(--color-text-muted); font-size: var(--font-size-sm); }
    .badge { min-width: 64px; text-align: center; padding: 4px 10px; border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-weight: 600; background: var(--color-bg); color: var(--color-text); }
    .badge.baixo { background: var(--color-danger); color: var(--color-primary-contrast); }
    form { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    input { flex: 1; min-width: 120px; height: 44px; padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
    button[type=submit] { height: 44px; padding: 0 var(--space-6); border: 0; border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-primary-contrast); font: inherit; font-weight: 600; }
    button:active { transform: scale(0.97); }
    .vazio { color: var(--color-text-muted); text-align: center; padding: var(--space-8) 0; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Estoque</h1>
      <p id="quem"></p>
    </div>
    <div class="menu-acoes" role="menu" aria-label="Ações da conta">
      <!-- component:menu-row size=md tone=default state=default --><div data-component="menu-row" data-size="md" data-tone="default" data-state="default" class="rounded-md font-body p-2 text-body bg-surface text-text" role="menuitem">
  <span class="menu-icone"><!-- slot:icon -->↻<!-- /slot:icon --></span>
  <!-- slot:label -->Atualizar lista<!-- /slot:label -->
  <span class="menu-atalho"><!-- slot:shortcut --><!-- /slot:shortcut --></span>
</div><!-- /component:menu-row -->
      <!-- component:menu-row size=md tone=danger state=default --><div data-component="menu-row" data-size="md" data-tone="danger" data-state="default" class="rounded-md font-body p-2 text-body bg-text text-bg" role="menuitem">
  <span class="menu-icone"><!-- slot:icon -->→<!-- /slot:icon --></span>
  <!-- slot:label -->Sair<!-- /slot:label -->
  <span class="menu-atalho"><!-- slot:shortcut --><!-- /slot:shortcut --></span>
</div><!-- /component:menu-row -->
    </div>
  </header>
  <main>
    <form id="novo">
      <label hidden for="nome">Nome do item</label>
      <input id="nome" placeholder="Nome do item" required>
      <label hidden for="sku">SKU</label>
      <input id="sku" placeholder="SKU" required>
      <label hidden for="qtd">Quantidade</label>
      <input id="qtd" type="number" min="0" placeholder="Qtd" required>
      <button type="submit">Adicionar</button>
    </form>
    <div id="lista"></div>
  </main>
  <script src="../mock.js"></script>
  <script>
    const lista = document.getElementById('lista')
    let proximoId = 1000

    function cartao(item) {
      const baixo = item.qty < item.min
      return `<div class="card">
        <div><strong>${item.name}</strong><small>SKU ${item.sku} · mínimo ${item.min}</small></div>
        <span class="badge${baixo ? ' baixo' : ''}">${item.qty} em estoque${baixo ? ' · repor' : ''}</span>
      </div>`
    }

    function renderizar(itens) {
      lista.innerHTML = itens.length
        ? itens.map(cartao).join('')
        : '<p class="vazio">Nenhum item cadastrado ainda.</p>'
    }

    async function iniciar() {
      const usuario = Mock.state.get('user') ?? (await Mock.data('users'))?.[0]
      document.getElementById('quem').textContent = `${usuario?.name ?? 'Visitante'} · ${usuario?.role ?? ''}`.trim()
      const base = (await Mock.data('items')) ?? []
      renderizar([...base, ...(Mock.state.get('extraItems') ?? [])])
    }

    document.getElementById('novo').addEventListener('submit', async (event) => {
      event.preventDefault()
      const nome = document.getElementById('nome').value.trim()
      const sku = document.getElementById('sku').value.trim().toUpperCase()
      const qty = Number(document.getElementById('qtd').value)
      if (!nome || !sku) return
      const extras = Mock.state.get('extraItems') ?? []
      extras.push({ id: ++proximoId, name: nome, sku, qty, min: 10 })
      Mock.state.set('extraItems', extras)
      event.target.reset()
      renderizar([...((await Mock.data('items')) ?? []), ...extras])
      Mock.toast(`${nome} adicionado ao estoque`)
    })

    document.querySelector('[data-component="menu-row"][data-tone="danger"]').addEventListener('click', () => {
      Mock.state.clear()
      Mock.go("../login/01-login.html")
    })

    document.querySelector('[data-component="menu-row"][data-tone="default"]').addEventListener('click', () => {
      Mock.go('01-overview.html')
    })

    iniciar()
  </script>
</body>
</html>
