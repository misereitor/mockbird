<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Componentes</title>
</head>
<body>
  <main class="p-4">
    <!-- component:button size=md tone=primary state=default --><button type="button" data-component="button" data-size="md" data-tone="primary" data-state="default" class="rounded-md font-body p-2 text-body bg-accent text-bg"><!-- slot:label -->Entrar<!-- /slot:label --></button><!-- /component:button -->
    <!-- component:card size=sm tone=ghost state=hover --><div data-component="card" data-size="sm" data-tone="ghost" data-state="hover" class="rounded-md font-body p-1 text-body text-accent border-accent">
  <!-- slot:title -->Título<!-- /slot:title -->
  <!-- slot:body -->Conteúdo<!-- /slot:body -->
</div><!-- /component:card -->
  </main>
</body>
</html>
