<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hard case: 17 nomes planos de ação</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; }
    ul { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
    button { min-height: 44px; min-width: 44px; }
  </style>
</head>
<body>
  <!-- CASO DURO (sintetico): 17 nomes PLANOS de acao (data-action sem
       namespace, sem ponto) - espelho dos 17 nomes planos do corpus. O
       validador prefere "ns.nome"; estes 17 existem para caracterizar o
       formato que as migracoes vao encontrar. -->
  <h1>17 nomes planos de ação</h1>
  <ul>
    <li><button type="button" data-action="salvar">Salvar</button></li>
    <li><button type="button" data-action="cancelar">Cancelar</button></li>
    <li><button type="button" data-action="abrir">Abrir</button></li>
    <li><button type="button" data-action="fechar">Fechar</button></li>
    <li><button type="button" data-action="editar">Editar</button></li>
    <li><button type="button" data-action="excluir">Excluir</button></li>
    <li><button type="button" data-action="confirmar">Confirmar</button></li>
    <li><button type="button" data-action="voltar">Voltar</button></li>
    <li><button type="button" data-action="avancar">Avançar</button></li>
    <li><button type="button" data-action="filtrar">Filtrar</button></li>
    <li><button type="button" data-action="exportar">Exportar</button></li>
    <li><button type="button" data-action="imprimir">Imprimir</button></li>
    <li><button type="button" data-action="duplicar">Duplicar</button></li>
    <li><button type="button" data-action="arquivar">Arquivar</button></li>
    <li><button type="button" data-action="restaurar">Restaurar</button></li>
    <li><button type="button" data-action="ordenar">Ordenar</button></li>
    <li><button type="button" data-action="buscar">Buscar</button></li>
  </ul>
</body>
</html>
