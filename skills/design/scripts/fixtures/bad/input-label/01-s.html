<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input label</title>
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: system-ui, sans-serif; }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--border-radius-sm); padding: var(--dimension-space-4); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Formulario</h1>
    <label>Nome <input type="text" name="nome"></label>
    <label for="email">E-mail</label>
    <input id="email" type="email">
    <input type="search" name="busca" aria-label="Busca">
    <input type="text" name="apelido">
  </main>
</body>
</html>
