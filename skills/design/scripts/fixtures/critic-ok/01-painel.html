<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de estoque</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color: #0f172a; background-color: #f1f5f9; font-family: system-ui, sans-serif; }
    body { padding: 24px; background-color: #f1f5f9; color: #0f172a; }
    main { max-width: 1120px; display: flex; flex-direction: column; gap: 16px; }
    section { background-color: #ffffff; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
    h1 { font-size: 28px; line-height: 1.2; color: #0f172a; }
    h2 { font-size: 20px; line-height: 1.3; color: #0f172a; }
    p { font-size: 16px; line-height: 1.5; color: #334155; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 12px; font-size: 16px; border-bottom: 1px solid #cbd5e1; }
    th { color: #334155; font-weight: 600; }
    td { color: #0f172a; }
    details { background-color: #ffffff; }
    summary { cursor: pointer; list-style: none; display: flex; align-items: center; min-height: 48px; padding: 12px 16px; font-size: 16px; color: #134e4a; background-color: #ffffff; border-radius: 8px; }
    .menu-opcao { display: flex; align-items: center; min-height: 48px; padding: 12px 16px; font-size: 16px; color: #0f172a; }
  </style>
</head>
<body>
  <!-- state:default -->
  <!-- state:loading -->
  <!-- state:empty -->
  <!-- state:dropdown -->
  <main>
    <section>
      <h1>Painel de estoque</h1>
      <p>Acompanhe níveis críticos e reposições da semana.</p>
    </section>
    <section>
      <h2>Itens monitorados</h2>
      <table>
        <thead>
          <tr><th>Item</th><th>SKU</th><th>Quantidade</th></tr>
        </thead>
        <tbody>
          <tr><td>Cafeteira prensa francesa</td><td>CAF-204</td><td>47</td></tr>
          <tr><td>Mesa de escritório apoio</td><td>MES-118</td><td>3</td></tr>
          <tr><td>Luminária de mesa articulada</td><td>LUM-076</td><td>12</td></tr>
        </tbody>
      </table>
    </section>
    <section>
      <h2>Ações rápidas</h2>
      <details>
        <summary>Exportar relatório</summary>
        <div class="menu-opcao">Exportar como CSV</div>
        <div class="menu-opcao">Exportar como PDF</div>
      </details>
    </section>
  </main>
</body>
</html>
