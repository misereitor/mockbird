<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de item</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color: #0f172a; background-color: #f1f5f9; font-family: system-ui, sans-serif; }
    body { padding: 24px; background-color: #f1f5f9; color: #0f172a; }
    main { max-width: 720px; display: flex; flex-direction: column; gap: 16px; }
    section { background-color: #ffffff; border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 28px; line-height: 1.2; color: #0f172a; }
    p { font-size: 16px; line-height: 1.5; color: #334155; }
    form { display: flex; flex-direction: column; gap: 16px; }
    label { display: flex; flex-direction: column; gap: 8px; font-size: 16px; color: #0f172a; }
    input, select { height: 48px; padding: 12px; font-size: 16px; color: #0f172a; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { min-height: 48px; padding: 12px 16px; font-size: 16px; color: #ffffff; background-color: #134e4a; border: 0; border-radius: 8px; }
    .ajuda { font-size: 16px; color: #334155; }
  </style>
</head>
<body>
  <!-- state:default -->
  <!-- state:form-invalid -->
  <main>
    <section>
      <h1>Cadastro de item</h1>
      <p>Registre um novo item para acompanhar o estoque.</p>
      <form>
        <label>Nome do item
          <input type="text" name="nome" autocomplete="off">
        </label>
        <label>Categoria
          <select name="categoria">
            <option>Cozinha</option>
            <option>Escritório</option>
            <option>Iluminação</option>
          </select>
        </label>
        <button type="submit">Salvar item</button>
        <p class="ajuda">Os campos nome e categoria são obrigatórios.</p>
      </form>
    </section>
  </main>
</body>
</html>
