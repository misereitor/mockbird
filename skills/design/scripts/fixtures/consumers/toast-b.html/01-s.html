<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer toast b</title>

<body>
  <!-- state:default -->
  <main class="p-4">
    <!-- component:toast size=md tone=error state=default --><div data-component="toast" data-size="md" data-tone="error" data-state="default" class="rounded-md font-body p-2 text-body bg-text text-bg">
  <span class="toast-icone"><!-- slot:icon -->!<!-- /slot:icon --></span>
  <p class="toast-mensagem m-0 leading-body" data-live="mock-live" aria-live="polite"><!-- slot:message -->Não foi possível salvar.<!-- /slot:message --></p>
  <!-- slot:action --><button type="button" class="toast-desfazer">Tentar novamente</button><!-- /slot:action -->
</div><!-- /component:toast -->
  </main>
</body>
