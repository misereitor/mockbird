<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer modal a</title>
</head>
<body>
  <main class="p-4">
    <!-- component:modal size=sm tone=default state=default --><div data-component="modal" data-size="sm" data-tone="default" data-state="default" class="rounded-md font-body p-1 text-body bg-surface text-text" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <h2 id="modal-titulo" class="m-0 modal-titulo text-heading font-bold"><!-- slot:header -->Confirmação<!-- /slot:header --></h2>
  <div class="modal-corpo mt-2"><!-- slot:body -->Corpo do modal pequeno.<!-- /slot:body --></div>
  <div class="modal-rodape mt-2"><!-- slot:footer --><button type="button" class="modal-fechar" data-autofocus data-close>Fechar</button><!-- /slot:footer --></div>
</div><!-- /component:modal -->
  </main>
</body>
</html>
