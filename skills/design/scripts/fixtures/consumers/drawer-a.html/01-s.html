<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer drawer a</title>
</head>
<body>
  <main class="p-4">
    <!-- component:drawer size=sm tone=default state=default --><div data-component="drawer" data-size="sm" data-tone="default" data-state="default" class="font-body p-1 text-body bg-surface text-text" role="dialog" aria-modal="true" aria-labelledby="drawer-titulo">
  <h2 id="drawer-titulo" class="m-0 drawer-titulo text-heading font-bold"><!-- slot:header -->Detalhes<!-- /slot:header --></h2>
  <div class="drawer-corpo mt-2"><!-- slot:body -->Corpo do painel lateral pequeno.<!-- /slot:body --></div>
  <div class="drawer-rodape mt-2"><!-- slot:footer --><button type="button" class="drawer-fechar" data-autofocus data-close>Fechar</button><!-- /slot:footer --></div>
</div><!-- /component:drawer -->
  </main>
</body>
