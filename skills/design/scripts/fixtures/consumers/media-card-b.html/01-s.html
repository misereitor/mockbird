<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consumer media-card b</title>
</head>
<body>
  <!-- state:default -->
  <main class="p-4">
    <!-- component:media-card size=md tone=default state=default --><div data-component="media-card" data-size="md" data-tone="default" data-state="default" class="rounded-md font-body p-2 text-body bg-surface text-text">
  <div class="media-card-capa min-h-4 bg-bg rounded-sm"><!-- slot:media --><img alt="Capa do álbum"><!-- /slot:media --></div>
  <h3 class="m-0 media-card-titulo text-body font-bold"><!-- slot:title -->Item médio<!-- /slot:title --></h3>
  <div class="media-card-corpo mt-2"><!-- slot:body -->Descrição longa do item de mídia.<!-- /slot:body --></div>
  <div class="media-card-acoes mt-2"><!-- slot:actions -->Ações<!-- /slot:actions --></div>
</div><!-- /component:media-card -->
  </main>
</body>
